<style>
  :root {
    --bg: #fbfbfd;
    --card: #ffffff;
    --fill: rgba(118,118,128,.10);   /* relleno de controles, como iOS */
    --seg-sel: #ffffff;              /* pastilla del segmento elegido */
    --sep: rgba(60,60,67,.16);       /* separadores hairline */
    --txt: #1d1d1f;
    --txt-2: #6e6e73;
    --txt-3: #86868b;
    --azul: #0071e3;
    --azul-txt: #ffffff;
    --sw-borde: rgba(0,0,0,.12);
    --sombra-pill: 0 3px 8px rgba(0,0,0,.10), 0 1px 1px rgba(0,0,0,.04);
    --r-card: 18px;
    --r-ctrl: 10px;
    --pad: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --fill: rgba(118,118,128,.24);
      /* en oscuro la pastilla NO puede ser del color de las tarjetas: sobre el
         fondo negro quedaba indistinguible del propio control. Gris claro, como iOS */
      --seg-sel: #636366;
      --sep: rgba(84,84,88,.45);
      --txt: #f5f5f7;
      --txt-2: #98989d;
      --txt-3: #8e8e93;
      --azul: #0a84ff;
      --azul-txt: #ffffff;
      --sw-borde: rgba(255,255,255,.28);
      --sombra-pill: 0 3px 8px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    letter-spacing: -0.01em;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; letter-spacing: inherit; }
  svg { display: block; }

  /* ---------- estructura ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + var(--pad)) 12px calc(env(safe-area-inset-left) + var(--pad));
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--sep);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 {
    font-size: 22px; font-weight: 600; margin: 0;
    letter-spacing: -0.025em; flex: 1;
  }
  header .sub {
    display: block; margin-top: 1px;
    font-size: 13px; font-weight: 400; color: var(--txt-2);
    letter-spacing: -0.005em;
  }
  .icon-btn {
    min-width: 44px; min-height: 44px;
    display: grid; place-items: center;
    background: none; border: 0; padding: 0;
    color: var(--azul);
  }

  main {
    padding: 20px calc(env(safe-area-inset-right) + var(--pad)) 24px calc(env(safe-area-inset-left) + var(--pad));
    max-width: 640px; margin: 0 auto;
    padding-bottom: calc(env(safe-area-inset-bottom) + 96px);
  }
  .pantalla[hidden] { display: none; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--sep);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1; min-height: 50px;
    background: none; border: 0;
    font-size: 10px; font-weight: 500; letter-spacing: 0;
    color: var(--txt-3);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  nav.tabs button[aria-selected="true"] { color: var(--azul); }

  /* ---------- bloques y rótulos ---------- */
  .bloque { margin-bottom: 26px; }
  .rotulo {
    font-size: 13px; font-weight: 400; color: var(--txt-2);
    margin: 0 0 8px 2px; letter-spacing: -0.005em;
  }

  /* ---------- control segmentado, estilo iOS ---------- */
  .seg {
    display: flex; gap: 2px;
    background: var(--fill);
    border-radius: var(--r-ctrl);
    padding: 2px;
  }
  .seg button {
    flex: 1; min-height: 44px;
    border: 0; border-radius: 8px;
    background: transparent;
    color: var(--txt);
    font-size: 15px; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    transition: background .18s ease, box-shadow .18s ease;
  }
  .seg button[aria-pressed="true"] {
    background: var(--seg-sel);
    box-shadow: var(--sombra-pill);
    font-weight: 590;
  }

  /* ---------- muestras de color ---------- */
  .grilla {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 14px 8px;
  }
  .sw {
    border: 0; background: none; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    min-height: 44px;
  }
  .sw .disco {
    width: 54px; height: 54px; border-radius: 50%;
    /* 1px y no hairline: es el contorno de una muestra, tiene que verse
       tanto en el blanco sobre fondo claro como en el negro sobre negro */
    border: 1px solid var(--sw-borde);
    transition: box-shadow .18s ease;
  }
  .sw[aria-pressed="true"] .disco {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--azul);
  }
  .sw .nom {
    font-size: 11px; line-height: 1.25; text-align: center;
    color: var(--txt-2); font-weight: 400; letter-spacing: -0.005em;
    max-width: 74px;
  }
  .sw[aria-pressed="true"] .nom { color: var(--txt); font-weight: 590; }
  /* punto discreto en los colores de tu paleta, sin estrellitas */
  .sw .nom::after {
    content: ''; display: block;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--azul); margin: 4px auto 0;
    visibility: hidden;
  }
  .sw.en-paleta .nom::after { visibility: visible; }

  /* ---------- tarjetas de combinación ---------- */
  .outfit {
    background: var(--card);
    border-radius: var(--r-card);
    overflow: hidden;
    margin-bottom: 14px;
    border: 0.5px solid var(--sep);

  .outfit .titulo {

  }
  .outfit .chev { color: var(--txt-3); transition: transform .2s ease; }
  .outfit.abierta .chev { transform: rotate(90deg); }
  .badge {
    font-size: 12px; font-weight: 510; letter-spacing: -0.005em;
    padding: 3px 9px; border-radius: 999px;
    background: var(--fill); color: var(--txt-2);
    white-space: nowrap;
  }

  .par { display: grid; grid-template-columns: 1fr 1fr; }
  .par .mitad {
    min-height: 160px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 14px 16px;
  }
  .par .mitad + .mitad { box-shadow: inset 0.5px 0 0 var(--sw-borde); }
  .par .slot {
    font-size: 12px; font-weight: 400; opacity: .7;
    letter-spacing: -0.005em; margin-bottom: 1px;
  }
  .par .cnom {
    font-size: 20px; font-weight: 590;
    letter-spacing: -0.025em; line-height: 1.15;
  }

  .porque {
    padding: 14px 16px 16px;
    margin: 0;
    font-size: 15px; color: var(--txt-2); line-height: 1.45;
  }
  .detalle {
    border-top: 0.5px solid var(--sep);
    padding: 14px 16px;
    font-size: 14px; color: var(--txt-2); line-height: 1.5;
  }
  .detalle b { color: var(--txt); font-weight: 510; }
  .detalle[hidden] { display: none; }

  /* ---------- evitar ---------- */
  .evitar { display: flex; flex-direction: column; gap: 10px; }
  .evitar .fila {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 0.5px solid var(--sep);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .evitar .muestra {
    width: 44px; height: 44px; border-radius: 10px;
    border: 1px solid var(--sw-borde); flex: none;
  }
  .evitar .txt { font-size: 15px; }
  .evitar .txt b { display: block; font-weight: 510; letter-spacing: -0.01em; }
  .evitar .txt span { color: var(--txt-2); font-size: 14px; }

  .vacio {
    background: var(--card); border: 0.5px solid var(--sep);
    border-radius: var(--r-card); padding: 26px 20px;
    text-align: center; color: var(--txt-2); font-size: 15px;
  }

  /* ---------- test ---------- */
  .preg { margin-bottom: 30px; }
  .preg h2 {
    font-size: 19px; font-weight: 590; margin: 0 0 12px;
    letter-spacing: -0.02em; line-height: 1.3;
  }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opts button {
    min-height: 52px; text-align: left;
    padding: 13px 16px;
    border-radius: 14px;
    border: 0.5px solid var(--sep);
    background: var(--card);
    font-size: 16px; font-weight: 400;
    transition: border-color .15s ease, background .15s ease;
  }
  .opts button[aria-pressed="true"] {
    border-color: var(--azul);
    box-shadow: inset 0 0 0 1px var(--azul);
    font-weight: 510;
  }
  .btn-grande {
    width: 100%; min-height: 50px;
    border-radius: 999px; border: 0;
    background: var(--azul); color: var(--azul-txt);
    font-size: 17px; font-weight: 510; letter-spacing: -0.01em;
  }
  .btn-grande[disabled] { opacity: .35; }
  .btn-texto {
    width: 100%; min-height: 48px; margin-top: 6px;
    border: 0; background: none; color: var(--azul);
    font-size: 16px; font-weight: 400;
  }

  /* ---------- mi paleta ---------- */
  .estacion-card { margin-bottom: 30px; }
  .estacion-card h2 {
    margin: 0 0 8px;
    font-size: 34px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.1;

  a { color: var(--azul); }
</style>

<script>
/* =========================================================================
   1. DATOS — catálogo de colores
   ========================================================================= */

/* temp:  calido | frio | neutro
   neutro: true = sirve de base (poco saturado o clásico de fondo de armario)
   estaciones: paletas personales donde ese color luce bien              */
const COLORES = [
  // --- neutros oscuros ---
  { id:'negro',      nombre:'Negro',        hex:'#16181D', temp:'frio',   neutro:true,  estaciones:['invierno'] },
  { id:'marino',     nombre:'Azul marino',  hex:'#1F2A44', temp:'frio',   neutro:true,  estaciones:['invierno','verano'] },
  { id:'carbon',     nombre:'Gris carbón',  hex:'#3B4048', temp:'frio',   neutro:true,  estaciones:['invierno','verano'] },
  { id:'chocolate',  nombre:'Chocolate',    hex:'#4A3728', temp:'calido', neutro:true,  estaciones:['otono'] },
  { id:'botella',    nombre:'Verde botella',hex:'#20463A', temp:'frio',   neutro:true,  estaciones:['invierno','otono'] },

  // --- neutros medios ---
  { id:'grisMedio',  nombre:'Gris medio',   hex:'#8A9098', temp:'frio',   neutro:true,  estaciones:['verano','invierno'] },
  { id:'azulAcero',  nombre:'Azul acero',   hex:'#55708C', temp:'frio',   neutro:true,  estaciones:['verano'] },
  { id:'denim',      nombre:'Denim',        hex:'#4A6FA5', temp:'frio',   neutro:true,  estaciones:['verano','primavera'] },
  { id:'cuero',      nombre:'Marrón cuero', hex:'#8B5E3C', temp:'calido', neutro:true,  estaciones:['otono','primavera'] },
  { id:'oliva',      nombre:'Verde oliva',  hex:'#6B7043', temp:'calido', neutro:true,  estaciones:['otono'] },
  { id:'taupe',      nombre:'Taupe',        hex:'#8A7F72', temp:'neutro', neutro:true,  estaciones:['verano','otono'] },

  // --- neutros claros ---
  { id:'blanco',     nombre:'Blanco',       hex:'#F7F7F5', temp:'frio',   neutro:true,  estaciones:['invierno','verano'] },
  { id:'crema',      nombre:'Crema',        hex:'#F0E7D6', temp:'calido', neutro:true,  estaciones:['primavera','otono'] },
  { id:'beige',      nombre:'Beige arena',  hex:'#DCCBB0', temp:'calido', neutro:true,  estaciones:['primavera','otono'] },
  { id:'camel',      nombre:'Camel',        hex:'#C29A6B', temp:'calido', neutro:true,  estaciones:['primavera','otono'] },
  { id:'grisClaro',  nombre:'Gris claro',   hex:'#C7CCD2', temp:'frio',   neutro:true,  estaciones:['verano','invierno'] },
  { id:'celeste',    nombre:'Celeste',      hex:'#BCD3E8', temp:'frio',   neutro:true,  estaciones:['verano','primavera'] },
  { id:'hielo',      nombre:'Azul hielo',   hex:'#DCE8F2', temp:'frio',   neutro:true,  estaciones:['invierno','verano'] },

  // --- acentos fríos ---
  { id:'burdeos',    nombre:'Burdeos',      hex:'#6E2639', temp:'frio',   neutro:false, estaciones:['invierno','otono'] },
  { id:'esmeralda',  nombre:'Esmeralda',    hex:'#1F7A5C', temp:'frio',   neutro:false, estaciones:['invierno'] },
  { id:'cobalto',    nombre:'Azul cobalto', hex:'#2A5DB0', temp:'frio',   neutro:false, estaciones:['invierno','primavera'] },
  { id:'ciruela',    nombre:'Ciruela',      hex:'#5A3A52', temp:'frio',   neutro:false, estaciones:['invierno','verano'] },
  { id:'rosaPolvo',  nombre:'Rosa polvo',   hex:'#C99EA4', temp:'frio',   neutro:false, estaciones:['verano'] },
  { id:'lavanda',    nombre:'Lavanda',      hex:'#9A8CB8', temp:'frio',   neutro:false, estaciones:['verano'] },
  { id:'rojo',       nombre:'Rojo',         hex:'#C0242C', temp:'frio',   neutro:false, estaciones:['invierno'] },
  { id:'fucsia',     nombre:'Fucsia',       hex:'#B03A6E', temp:'frio',   neutro:false, estaciones:['invierno'] },

  // --- acentos cálidos ---
  { id:'terracota',  nombre:'Terracota',    hex:'#B4573A', temp:'calido', neutro:false, estaciones:['otono','primavera'] },
  { id:'oxido',      nombre:'Óxido',        hex:'#9C4A2A', temp:'calido', neutro:false, estaciones:['otono'] },
  { id:'mostaza',    nombre:'Mostaza',      hex:'#C79A2E', temp:'calido', neutro:false, estaciones:['otono','primavera'] },
  { id:'coral',      nombre:'Coral',        hex:'#E8836A', temp:'calido', neutro:false, estaciones:['primavera'] },
  { id:'turquesa',   nombre:'Turquesa',     hex:'#2E8B8B', temp:'calido', neutro:false, estaciones:['primavera'] },
  { id:'salvia',     nombre:'Verde salvia', hex:'#A3B18A', temp:'neutro', neutro:false, estaciones:['verano','primavera'] },
];

/* --- derivados: HSL + luminancia, calculados una sola vez --- */
function hexToRgb(hex) {
  return [1,3,5].map(i => parseInt(hex.substr(i,2),16));
}
function rgbToHsl(r,g,b) {
  r/=255; g/=255; b/=255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  const l = (max+min)/2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if (max === r)      h = ((g-b)/d + (g < b ? 6 : 0));
    else if (max === g) h = ((b-r)/d + 2);
    else                h = ((r-g)/d + 4);
    h *= 60;
  }
  return [h, s*100, l*100];
}
/* luminancia percibida 0-100 (Rec. 601), más fiel al ojo que la L de HSL */
function luma(r,g,b) { return (0.299*r + 0.587*g + 0.114*b) / 255 * 100; }

/* luminancia relativa WCAG y razón de contraste, para elegir el color del texto
   que va encima de cada muestra */
function lumRelativa(r,g,b) {
  const f = v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
}
function contraste(l1, l2) {
  return (Math.max(l1,l2) + 0.05) / (Math.min(l1,l2) + 0.05);
}

const PORID = {};
COLORES.forEach(c => {
  const [r,g,b] = hexToRgb(c.hex);
  const [h,s,l] = rgbToHsl(r,g,b);
  c.h = h; c.s = s; c.l = l;
  c.lum = luma(r,g,b);
  c.acromatico = s < 12;          // gris/blanco/negro: el matiz no dice nada
  c.acentoFuerte = s > 45;
  // negro o blanco encima, el que más contraste dé contra este color
  const lr = lumRelativa(r,g,b);
  c.txt = contraste(lr, 0) >= contraste(lr, 1) ? '#000000' : '#FFFFFF';
  PORID[c.id] = c;
});

const SLOTS = [
  { id:'arriba',   nombre:'Arriba',   corto:'Arriba',   pregunta:'la remera, camisa o sweater' },
  { id:'pantalon', nombre:'Pantalón', corto:'Pantalón', pregunta:'el pantalón' },
];

/* =========================================================================
   2. DATOS — qué color es admisible en cada slot según la ocasión
   ========================================================================= */
const OCASIONES = {
  oficina: {
    nombre: 'Oficina',
    arriba:   ['blanco','celeste','crema','grisClaro','hielo','beige','rosaPolvo','lavanda','salvia','denim','marino','oliva','azulAcero','burdeos'],
    pantalon: ['marino','carbon','grisMedio','negro','camel','oliva','beige','chocolate','azulAcero','taupe'],
  },
  elegante: {
    nombre: 'Elegante',
    arriba:   ['blanco','celeste','crema','grisClaro','hielo','rosaPolvo','lavanda'],
    pantalon: ['marino','carbon','negro','grisMedio','botella','burdeos','chocolate'],
  },
  informal: {
    nombre: 'Informal',
    arriba:   COLORES.map(c => c.id),
    pantalon: ['marino','carbon','grisMedio','negro','camel','oliva','beige','chocolate','denim','azulAcero','taupe','crema','burdeos','botella','cuero'],
  },
};

const ESTACIONES = {
  primavera: { nombre:'Primavera', desc:'Cálido, claro y limpio. Te favorecen los colores con luz: camel, coral, crema, turquesa. Lo apagado y lo muy oscuro te apaga la cara.' },
  verano:    { nombre:'Verano',    desc:'Frío y suave. Te favorecen los tonos lavados: azul acero, gris medio, rosa polvo, salvia. Los colores estridentes te comen.' },
  otono:     { nombre:'Otoño',     desc:'Cálido y profundo. Te favorece la tierra: oliva, óxido, chocolate, mostaza, camel. El negro y los fríos brillantes te endurecen.' },
  invierno:  { nombre:'Invierno',  desc:'Frío, profundo y contrastado. Te favorecen negro, blanco puro, marino, burdeos, esmeralda. Los beiges y los pasteles apagados te desdibujan.' },
};
const OPUESTA = { primavera:'invierno', invierno:'primavera', verano:'otono', otono:'verano' };

/* pares clásicos de sastrería que siempre funcionan (pantalón + arriba) */
const CLASICOS = new Set([
  ['marino','blanco'], ['marino','celeste'], ['marino','crema'],
  ['carbon','blanco'], ['carbon','celeste'],
  ['grisMedio','blanco'], ['grisMedio','celeste'],
  ['oliva','crema'], ['oliva','blanco'],
  ['beige','blanco'], ['beige','celeste'],
  ['camel','marino'], ['chocolate','celeste'],
  ['negro','blanco'], ['denim','blanco'],
].map(t => t.slice().sort().join('|')));

const MARRONES = ['chocolate','cuero','camel','taupe','beige','crema'];
const TIERRA = ['camel','chocolate','oliva','crema','beige','terracota','oxido','mostaza','cuero','taupe','botella'];

/* =========================================================================
   3. MOTOR — reglas de combinación
   ========================================================================= */
function distMatiz(a, b) {
  if (a.acromatico || b.acromatico) return null;   // sin matiz que comparar
  const d = Math.abs(a.h - b.h);
  return Math.min(d, 360 - d);
}

/* Conflicto entre dos prendas concretas. Devuelve el motivo, o null si van bien.
   Se usa tanto para descartar outfits como para armar la lista de "Evitar hoy". */
function conflictoPar(a, b, slotA, slotB, ocasion) {
  const ids = [a.id, b.id];
  const tiene = id => ids.includes(id);

  if (tiene('negro') && MARRONES.some(m => tiene(m) && m !== 'crema' && m !== 'beige'))
    return 'el negro con el marrón se pelean: ninguno de los dos manda';

  if (tiene('negro') && tiene('marino')) {
    if (ocasion !== 'informal')
      return 'negro y azul marino juntos parecen un error de luz, no una decisión';
  }

  // contraste entre arriba y pantalón: el error más común
  if ((slotA === 'arriba' && slotB === 'pantalon') || (slotA === 'pantalon' && slotB === 'arriba')) {
    const dL = Math.abs(a.lum - b.lum);
    if (a.id === b.id) {
      if (!a.neutro) return 'todo del mismo color saturado es disfraz, no outfit';
    } else if (dL < 9) {
      return 'quedan casi igual de claros: se lee como que no matcheaste, no como tono sobre tono';
    } else {
      const dh = distMatiz(a, b);
      if (dL < 14 && dh !== null && dh > 20)
        return 'mismo nivel de claridad pero matices distintos: el clásico "azul medio con gris medio"';
    }
  }

  // dos colores muy parecidos pero no iguales, en cualquier par
  if (a.id !== b.id && !a.acromatico && !b.acromatico) {
    const dh = distMatiz(a, b);
    if (dh !== null && dh < 18 && Math.abs(a.lum - b.lum) < 12 && Math.abs(a.s - b.s) < 18)
      return 'son casi el mismo color: parece que uno destiñó';
  }

  return null;
}

function evaluar(arriba, pantalon, ocasion, estacion) {
  const prendas = [
    { c: arriba,   slot:'arriba' },
    { c: pantalon, slot:'pantalon' },
  ];

  // ---- descartes duros ----
  if (conflictoPar(arriba, pantalon, 'arriba', 'pantalon', ocasion)) return null;
  const acentos = prendas.filter(p => p.c.acentoFuerte);
  if (acentos.length > 1) return null;   // las dos prendas gritando a la vez

  // ---- puntaje ----
  let score = 50;
  const especificas = [];   // dicen algo de ESTOS colores
  const genericas = [];     // valen para cualquier outfit parecido

  // si es un clásico, eso ya lo explica todo: no hace falta razonarlo dos veces
  const clave = [arriba.id, pantalon.id].slice().sort().join('|');
  const esClasico = CLASICOS.has(clave);

  const neutros = prendas.filter(p => p.c.neutro).length;
  if (neutros === 2)      { score += 6;  genericas.push('dos neutros: sobrio y seguro'); }
  else if (neutros === 1) { score += 13; genericas.push('un neutro de base y un solo color protagonista'); }
  else                    { score -= 6; }

  const dL = Math.abs(arriba.lum - pantalon.lum);
  if (dL >= 55)      { score += 6;  if (!esClasico) especificas.push(arriba.nombre.toLowerCase() + ' sobre ' + pantalon.nombre.toLowerCase() + ' marca bien las dos mitades'); }
  else if (dL >= 20) { score += 9;  genericas.push('el contraste entre arriba y abajo separa las dos mitades'); }

  // armonía entre los dos colores más cromáticos
  const cromaticos = prendas.map(p => p.c).filter(c => !c.acromatico).sort((x,y) => y.s - x.s);
  let dhPrincipal = null;
  if (cromaticos.length >= 2) {
    const dh = distMatiz(cromaticos[0], cromaticos[1]);
    dhPrincipal = dh;
    const par = cromaticos[0].nombre.toLowerCase() + ' y ' + cromaticos[1].nombre.toLowerCase();
    if (dh !== null) {
      if (dh < 15)                    { score += 6; especificas.push(par + ' son el mismo matiz en dos intensidades'); }
      else if (dh < 45)               { score += 8; especificas.push(par + ' son matices vecinos, se acompañan'); }
      else if (dh >= 150 && dh <= 210){ score += 9; especificas.push(par + ' son opuestos y se realzan'); }
      else if (dh >= 60 && dh <= 120) { score -= 7; }
    }
  }

  const calidos = prendas.filter(p => p.c.temp === 'calido' && p.c.s > 20).length;
  const frios   = prendas.filter(p => p.c.temp === 'frio'   && p.c.s > 20).length;
  if (calidos && frios) score -= 7;
  else if (calidos === 2 || frios === 2) { score += 4; }

  if (estacion) {
    const enPaleta = prendas.filter(p => p.c.estaciones.includes(estacion)).length;
    score += enPaleta * 6;
    const fuera = prendas.filter(p => p.c.estaciones.includes(OPUESTA[estacion])).length;
    score -= fuera * 4;
  }

  if (esClasico) {
    score += 22;
    especificas.length = 0;   // el clásico se explica solo
    genericas.length = 0;
    especificas.push(arriba.nombre.toLowerCase() + ' con ' + pantalon.nombre.toLowerCase() +
                     ' es de manual: sale bien siempre');
  }

  // ---- etiqueta ----
  let etiqueta = 'Combinación equilibrada';
  if (esClasico)                                                    etiqueta = 'Clásico infalible';
  else if (prendas.every(p => TIERRA.includes(p.c.id)))             etiqueta = 'Tonos tierra';
  else if (dL >= 55)                                                etiqueta = 'Contraste alto';
  else if (neutros === 1 && acentos.length === 1)                   etiqueta = 'Un solo acento';
  else if (dhPrincipal !== null && dhPrincipal < 25)                etiqueta = 'Tono sobre tono';
  else if (neutros === 2)                                           etiqueta = 'Sobrio';

  const enPaleta = estacion ? prendas.filter(p => p.c.estaciones.includes(estacion)).length : 0;
  if (enPaleta === 2) especificas.push('las dos caen dentro de tu paleta ' + ESTACIONES[estacion].nombre.toLowerCase());

  const razones = especificas.concat(genericas);
  return {
    arriba, pantalon, score, etiqueta, enPaleta,
    razon: razones.slice(0, 2).join('; ') || 'los dos tonos conviven sin pelearse',
  };
}

/* Genera los mejores outfits partiendo de una prenda fija. */
function sugerir(slotBase, colorBase, ocasion, estacion) {
  const oc = OCASIONES[ocasion];
  const opciones = {};
  SLOTS.forEach(s => {
    opciones[s.id] = s.id === slotBase ? [colorBase] : oc[s.id].map(id => PORID[id]);
  });

  const todos = [];
  opciones.arriba.forEach(a =>
    opciones.pantalon.forEach(p => {
      const r = evaluar(a, p, ocasion, estacion);
      if (r) todos.push(r);
    }));

  // con dos prendas cada candidato ya difiere en el único slot que varía,
  // así que no hace falta forzar variedad: alcanza con ordenar y cortar
  todos.sort((x, y) => y.score - x.score);
  return todos.slice(0, 6);
}

/* Colores que chocan con la prenda base, con el motivo. */
function evitarCon(slotBase, colorBase, ocasion) {
  const oc = OCASIONES[ocasion];
  const salida = [];
  const vistos = new Set();
  for (const s of SLOTS) {
    if (s.id === slotBase) continue;
    for (const id of oc[s.id]) {
      if (vistos.has(id)) continue;
      const motivo = conflictoPar(colorBase, PORID[id], slotBase, s.id, ocasion);
      if (motivo) {
        vistos.add(id);
        salida.push({ color: PORID[id], slot: s, motivo });
      }
    }
  }
  return salida.slice(0, 3);
}

function calcularEstacion(respuestas) {
  let calido = 0, prof = 0;
  respuestas.forEach((iOpt, iPreg) => {
    const o = PREGUNTAS[iPreg].o[iOpt];
    calido += o.calido; prof += o.prof;
  });
  if (calido > 0)  return prof > 0 ? 'otono' : 'primavera';
  return prof > 0 ? 'invierno' : 'verano';
}

   ========================================================================= */
const CLAVE = 'combina.v1';
const estado = {
  estacion: null,
  ocasion: 'oficina',
  slot: 'pantalon',
  color: 'marino',
  pantalla: 'hoy',
};

function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify({
      estacion: estado.estacion, ocasion: estado.ocasion,
      slot: estado.slot, color: estado.color,
    }));
  } catch (e) { /* modo privado de Safari: seguimos sin guardar */ }
}
function cargar() {
  try {
    const raw = localStorage.getItem(CLAVE);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.estacion && ESTACIONES[d.estacion]) estado.estacion = d.estacion;
    if (d.ocasion && OCASIONES[d.ocasion])    estado.ocasion  = d.ocasion;
    if (d.slot && SLOTS.some(s => s.id === d.slot)) estado.slot = d.slot;
    if (d.color && PORID[d.color])            estado.color    = d.color;
    return true;
  } catch (e) { return false; }
}

/* =========================================================================
   6. UI
   ========================================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function mostrarPantalla(cual) {
  estado.pantalla = cual;
  $('pHoy').hidden    = cual !== 'hoy';
  $('pPaleta').hidden = cual !== 'paleta';
  $('pTest').hidden   = cual !== 'test';
  $('tabHoy').setAttribute('aria-selected', cual === 'hoy');
  $('tabPaleta').setAttribute('aria-selected', cual === 'paleta');
  const titulos = {
    hoy:    ['¿Combina?', 'Elegí una prenda y mirá con qué va'],
    paleta: ['Mi paleta', estado.estacion ? ESTACIONES[estado.estacion].nombre : 'Todavía sin definir'],
    test:   ['Tu paleta', 'Cuatro preguntas y listo'],
  };
  $('tituloApp').innerHTML = esc(titulos[cual][0]) +
    '<span class="sub">' + esc(titulos[cual][1]) + '</span>';
  window.scrollTo(0, 0);
}

function pintarChips(cont, items, activoId, onPick) {
  cont.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(it.id === activoId));
    b.textContent = it.nombre;
    b.addEventListener('click', () => onPick(it.id));
    cont.appendChild(b);
  });
}

function pintarGrilla() {
  const permitidos = OCASIONES[estado.ocasion][estado.slot];
  if (!permitidos.includes(estado.color)) estado.color = permitidos[0];

  const slot = SLOTS.find(s => s.id === estado.slot);
  $('rotuloColor').textContent = '…' + slot.pregunta + ', de este color';

  const g = $('grillaColores');
  g.innerHTML = '';
  permitidos.forEach(id => {
    const c = PORID[id];
    const b = document.createElement('button');
    b.type = 'button';
    const enPaleta = estado.estacion && c.estaciones.includes(estado.estacion);
    b.className = 'sw' + (enPaleta ? ' en-paleta' : '');
    b.setAttribute('aria-pressed', String(id === estado.color));
    b.setAttribute('aria-label', c.nombre + (enPaleta ? ', en tu paleta' : ''));
    b.innerHTML =
      '<span class="disco" style="background:' + c.hex + '"></span>' +
      '<span class="nom">' + esc(c.nombre) + '</span>';
    b.addEventListener('click', () => {
      estado.color = id;
      guardar();
      pintarGrilla();
      pintarResultados(true);
    });
    g.appendChild(b);
  });
}

/* Negro o blanco, el que se lea mejor sobre ese color (calculado en el catálogo). */
function textoSobre(c) { return c.txt; }

function tarjetaOutfit(r, i) {
  const mitades = SLOTS.map(s => {
    const c = r[s.id];
    return '<div class="mitad" style="background:' + c.hex + ';color:' + textoSobre(c) + '">' +
      '<span class="slot">' + esc(s.corto) + '</span>' +
      '<span class="cnom">' + esc(c.nombre) + '</span>' +
    '</div>';
  }).join('');

  const badge = r.enPaleta === 2 ? '<span class="badge">Tu paleta</span>' : '';
  const hexes = SLOTS.map(s => esc(r[s.id].nombre) + ' <b>' + r[s.id].hex + '</b>').join(' · ');
  const chevron = '<svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none" ' +
    'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>';

  return '<article class="outfit">' +
    '<button class="cab" type="button" data-detalle="' + i + '">' +
      '<span class="titulo">' + esc(r.etiqueta) + '</span>' + badge + chevron +
    '</button>' +
    '<div class="par">' + mitades + '</div>' +
    '<p class="porque">' + esc(r.razon.charAt(0).toUpperCase() + r.razon.slice(1)) + '.</p>' +
    '<div class="detalle" id="det' + i + '" hidden>' + hexes +
      '<br><br>Si los dos tonos te quedan muy planos, jugá con la textura: ' +
      'una prenda con trama (lino, oxford, gamuza) rompe la monotonía sin sumar un tercer color.' +
    '</div>' +
  '</article>';
}

function pintarResultados(scroll) {
  const res = sugerir(estado.slot, PORID[estado.color], estado.ocasion, estado.estacion);
  const cont = $('bloqueResultados');

  if (!res.length) {
    cont.innerHTML = '<p class="rotulo">Combinaciones</p>' +
      '<div class="vacio">Con ese color no sale nada limpio para esta ocasión. ' +
      'Probá otro color de base, o cambiá a Informal.</div>';
  } else {
    cont.innerHTML = '<p class="rotulo">' + res.length + ' formas de completarlo</p>' +
      res.map(tarjetaOutfit).join('');
    cont.querySelectorAll('[data-detalle]').forEach(b => {
      b.addEventListener('click', () => {
        const d = $('det' + b.dataset.detalle);
        d.hidden = !d.hidden;
        b.closest('.outfit').classList.toggle('abierta', !d.hidden);
      });
    });
  }

  const ev = evitarCon(estado.slot, PORID[estado.color], estado.ocasion);
  const contEv = $('bloqueEvitar');
  if (!ev.length) {
    contEv.innerHTML = '';
  } else {
    contEv.innerHTML = '<p class="rotulo">Evitá hoy</p><div class="evitar">' +
      ev.map(e =>
        '<div class="fila">' +
          '<span class="muestra" style="background:' + e.color.hex + '"></span>' +
          '<span class="txt"><b>' + esc(e.color.nombre) + ' en ' + esc(e.slot.corto.toLowerCase()) + '</b>' +
          '<span>' + esc(e.motivo) + '</span></span>' +
        '</div>').join('') +
      '</div>';
  }

  if (scroll) {
    requestAnimationFrame(() => {
      cont.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
}

function pintarHoy() {
  pintarChips($('chipsOcasion'),
    Object.keys(OCASIONES).map(id => ({ id, nombre: OCASIONES[id].nombre })),
    estado.ocasion,
    id => { estado.ocasion = id; guardar(); pintarHoy(); pintarResultados(false); });

  pintarChips($('chipsSlot'),
    SLOTS.map(s => ({ id: s.id, nombre: s.corto })),
    estado.slot,
    id => { estado.slot = id; guardar(); pintarHoy(); pintarResultados(false); });

  pintarGrilla();
}

function pintarPaleta() {
  const cont = $('pPaleta');
  if (!estado.estacion) {
    cont.innerHTML = '<div class="vacio">Todavía no hiciste el test.<br><br>' +
      '<button class="btn-grande" id="btnIrTest">Hacer el test (1 minuto)</button></div>';
    $('btnIrTest').addEventListener('click', abrirTest);
    return;
  }

  const e = ESTACIONES[estado.estacion];
  const tuyos = COLORES.filter(c => c.estaciones.includes(estado.estacion));
  // sólo los acentos de la estación opuesta: los neutros (marino, gris, blanco…)
  // son caballo de batalla de cualquier armario y no tiene sentido desaconsejarlos
  const ajenos = COLORES.filter(c => !c.neutro &&
                                     c.estaciones.includes(OPUESTA[estado.estacion]) &&
                                     !c.estaciones.includes(estado.estacion));

  const grilla = arr => '<div class="grilla">' + arr.map(c =>
    '<div class="sw"><span class="disco" style="background:' + c.hex + '"></span>' +
    '<span class="nom">' + esc(c.nombre) + '</span></div>').join('') + '</div>';

  cont.innerHTML =
    '<div class="estacion-card">' +
      '<h2>' + esc(e.nombre) + '</h2>' +
      '<p>' + esc(e.desc) + '</p>' +
    '</div>' +
    '<div class="bloque"><p class="rotulo">Tus colores</p>' + grilla(tuyos) + '</div>' +
    (ajenos.length
      ? '<div class="bloque"><p class="rotulo">Con cuidado</p>' + grilla(ajenos) +
        '<p class="nota" style="margin-top:10px">No están prohibidos: alejalos de la cara. ' +
        'Sirven perfecto en el pantalón, donde no compiten con tu piel.</p></div>'
      : '') +
    '<div class="bloque"><button class="btn-texto" id="btnRehacer">Rehacer el test</button></div>';

  $('btnRehacer').addEventListener('click', abrirTest);
}

/* --- test --- */
let respuestas = [];

function pintarTest() {
  const cont = $('preguntas');
  cont.innerHTML = PREGUNTAS.map((p, i) =>
    '<div class="preg"><h2>' + (i+1) + '. ' + esc(p.t) + '</h2><div class="opts">' +
    p.o.map((o, j) =>
      '<button type="button" data-p="' + i + '" data-o="' + j + '" aria-pressed="' +
      (respuestas[i] === j) + '">' + esc(o.txt) + '</button>').join('') +
    '</div></div>').join('');

  cont.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      respuestas[+b.dataset.p] = +b.dataset.o;
      pintarTest();
    });
  });

  const completo = PREGUNTAS.every((_, i) => respuestas[i] !== undefined);
  $('btnVerResultado').disabled = !completo;
}

function abrirTest() {
  respuestas = [];
  pintarTest();
  mostrarPantalla('test');
}
